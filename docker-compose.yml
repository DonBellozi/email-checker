services:
  email-checker:
    build: .
    container_name: email-checker
    restart: unless-stopped
    ports:
      - "8083:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe-8083}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      DB_PATH: /app/data/email-checker.db
    volumes:
      - ./data:/app/data
